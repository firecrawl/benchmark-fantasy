[project]
name = "fantasybench"
version = "1.0.0"
description = "FantasyBench: can AI agents get fantasy football data right? Three agent setups scored against fixed answer keys"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Re-grading and reporting use the Python standard library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fantasybench-report = "fantasybench.report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fantasybench"]

[tool.pytest.ini_options]
testpaths = ["fantasybench/tests"]
